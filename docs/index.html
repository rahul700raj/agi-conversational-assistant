<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Conversational Assistant - Aisha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            height: 90vh;
        }

        .character-section {
            background: var(--surface);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .character-container {
            position: relative;
            width: 300px;
            height: 400px;
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #characterCanvas {
            width: 100%;
            height: 100%;
        }

        .emotion-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 48px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .character-name {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .chat-section {
            background: var(--surface);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 30px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message { justify-content: flex-end; }
        .assistant-message { justify-content: flex-start; }

        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
        }

        .user-message .message-content {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant-message .message-content {
            background: var(--background);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .timestamp {
            display: block;
            font-size: 11px;
            margin-top: 5px;
            opacity: 0.7;
        }

        .chat-input-container {
            padding: 20px 30px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid var(--border);
            border-radius: 25px;
            font-size: 15px;
            outline: none;
        }

        #messageInput:focus {
            border-color: var(--primary-color);
        }

        #sendButton {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .api-notice {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 15px;
            margin: 20px;
            text-align: center;
        }

        .api-notice h3 {
            color: #92400e;
            margin-bottom: 10px;
        }

        .api-notice input {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            border: 2px solid #f59e0b;
            border-radius: 5px;
            margin: 10px 0;
        }

        .api-notice button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="character-section">
            <div class="character-container">
                <canvas id="characterCanvas"></canvas>
                <div class="emotion-indicator" id="emotionIndicator">😊</div>
            </div>
            <div class="character-name">Aisha</div>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <h1>🤖 AGI Assistant</h1>
                <div class="status">
                    <span class="status-dot"></span>
                    <span id="statusText">Demo Mode</span>
                </div>
            </div>

            <div id="apiNotice" class="api-notice">
                <h3>⚠️ API Key Required</h3>
                <p>To use the full AI features, please enter your Google Gemini API key:</p>
                <input type="text" id="apiKeyInput" placeholder="Enter your Gemini API key here...">
                <button onclick="saveApiKey()">Save API Key</button>
                <p style="margin-top: 10px; font-size: 12px;">
                    Get your free API key from: <a href="https://makersuite.google.com/app/apikey" target="_blank">Google AI Studio</a>
                </p>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message assistant-message">
                    <div class="message-content">
                        <p>नमस्ते! मैं Aisha हूं। मैं आपकी कैसे मदद कर सकती हूं? 😊</p>
                        <span class="timestamp">Just now</span>
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <input type="text" id="messageInput" placeholder="Type your message here...">
                <button id="sendButton">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Character Animation
        class CharacterAnimation {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.frame = 0;
                this.setupCanvas();
                this.startAnimationLoop();
            }

            setupCanvas() {
                this.canvas.width = 300;
                this.canvas.height = 400;
            }

            startAnimationLoop() {
                const animate = () => {
                    this.frame++;
                    this.draw();
                    requestAnimationFrame(animate);
                };
                animate();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const breathe = Math.sin(this.frame * 0.05) * 3;

                // Head
                this.ctx.fillStyle = '#FFD1DC';
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY - 50 + breathe, 60, 0, Math.PI * 2);
                this.ctx.fill();

                // Hair
                this.ctx.fillStyle = '#4A4A4A';
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY - 70 + breathe, 65, Math.PI, Math.PI * 2);
                this.ctx.fill();

                // Eyes
                this.ctx.fillStyle = '#2C3E50';
                this.ctx.beginPath();
                this.ctx.arc(centerX - 20, centerY - 60 + breathe, 5, 0, Math.PI * 2);
                this.ctx.arc(centerX + 20, centerY - 60 + breathe, 5, 0, Math.PI * 2);
                this.ctx.fill();

                // Smile
                this.ctx.strokeStyle = '#E74C3C';
                this.ctx.lineWidth = 2;
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY - 40 + breathe, 20, 0, Math.PI);
                this.ctx.stroke();

                // Body
                this.ctx.fillStyle = '#667eea';
                this.ctx.fillRect(centerX - 40, centerY + 20 + breathe, 80, 100);

                // Arms
                this.ctx.strokeStyle = '#FFD1DC';
                this.ctx.lineWidth = 10;
                this.ctx.beginPath();
                this.ctx.moveTo(centerX - 40, centerY + 30 + breathe);
                this.ctx.lineTo(centerX - 70, centerY + 80 + breathe);
                this.ctx.moveTo(centerX + 40, centerY + 30 + breathe);
                this.ctx.lineTo(centerX + 70, centerY + 80 + breathe);
                this.ctx.stroke();
            }
        }

        // Initialize
        const animation = new CharacterAnimation('characterCanvas');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        let apiKey = localStorage.getItem('gemini_api_key');

        if (apiKey) {
            document.getElementById('apiNotice').style.display = 'none';
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                apiKey = key;
                document.getElementById('apiNotice').style.display = 'none';
                addMessage('API Key saved! You can now chat with full AI features.', 'assistant');
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            messageInput.value = '';

            if (!apiKey) {
                addMessage('Please enter your Gemini API key above to enable AI responses.', 'assistant');
                return;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: message }]
                        }]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not generate a response.';
                addMessage(aiResponse, 'assistant');
            } catch (error) {
                addMessage('Error connecting to AI. Please check your API key.', 'assistant');
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.innerHTML = `
                <div class="message-content">
                    <p>${text}</p>
                    <span class="timestamp">${new Date().toLocaleTimeString()}</span>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
